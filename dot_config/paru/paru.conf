#
# $PARU_CONF
# /etc/paru.conf
# ~/.config/paru/paru.conf
#
# See the paru.conf(5) manpage for options
#
# Diese Datei ersetzt /etc/paru.conf komplett (paru liest nur eine Config),
# daher sind die Standard-Optionen aus /etc/paru.conf hier mit übernommen.

#
# GENERAL OPTIONS
#
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
#AurOnly
#BottomUp
#RemoveMake
#SudoLoop
#UseAsk
#SaveChanges
#CombinedUpgrade
#CleanAfter
#UpgradeMenu
#NewsOnUpgrade
#MinimumReleaseAge = 3d
#MinimumReleaseAgeExclude

#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
#[bin]
#FileManager = vifm
#MFlags = --skippgpcheck
#Sudo = doas

#
# PKGBUILD REPOSITORIES
#
# Eigenes PKGBUILD-Repo, wird von paru wie das AUR behandelt (hat Vorrang vor dem AUR).
# Sync: paru -Sy --pkgbuilds
[leonrein]
Url = https://github.com/LeonRein/paru-repository.git
