ref_knob_db = -19.0
low_hz = 35  # a little below the speakers' limit, for tolerance

# Mono-Bass: wirkt nur bei Aufnahmen, deren Bass links und rechts verschieden ist.
# Füllt dann die Senke der linken Box bei 62–82 Hz. 0 = aus.
mono_bass_hz = 110
#mono_bass_hz = 0   # aus

# --- Raummoden: zeitbewusst ausgelegt (20.11.2026) ---
# Ziel: eingeschwungen nicht über der Zielkurve (kein Dröhnen), der Anschlag (erste 3 Schwingungen)
# aber nicht darunter. Gemittelt über alle 6 Mikrofonpositionen. Vorher: config.toml.bak-2026-11-20.
# Unter der Mono-Bass-Weiche (110 Hz) spielen beide Boxen dasselbe: dort gleiche Filter für beide.
[[eq]]
type = "peaking"   # Längsmode 40 Hz
freq = 41.8
q = 10.0
gain = -6.7

[[eq]]
type = "peaking"   # Breitenmode 44 Hz
freq = 45.2
q = 10.0
gain = -3.7

[[eq]]
type = "peaking"   # Mode 60 Hz
freq = 59.6
q = 10.0
gain = -2.7

# Über der Weiche spielt jede Box ihr eigenes Signal: Filter je Box.
[[eq]]
type = "peaking"   # Modencluster 120 Hz
channel = "left"
freq = 121.0
q = 9.9
gain = -8.6

[[eq]]
type = "peaking"
channel = "left"
freq = 170.6
q = 3.9
gain = -1.9

[[eq]]
type = "peaking"   # Modencluster 120 Hz (zwei Filter übereinander: Q>10 geht nicht)
channel = "right"
freq = 119.2
q = 10.0
gain = -10.1

[[eq]]
type = "peaking"
channel = "right"
freq = 120.7
q = 8.1
gain = -3.7

[[eq]]
type = "peaking"
channel = "right"
freq = 151.4
q = 10.0
gain = -2.7

