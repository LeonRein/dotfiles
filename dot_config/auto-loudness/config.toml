# --- Lautsprecher selbst: spinorama AutomaticEQ (IIR) aus Erins Klippel-Messung, ohne die
#     beiden Bassbänder (37 Hz +1,5 dB, 139 Hz -1,9 dB), die hier die Raum-EQ ersetzt ---
[[eq]]
type = "peaking"
freq = 356
q = 0.49
gain = 2.41

[[eq]]
type = "peaking"
freq = 439
q = 1.31
gain = -2.61

[[eq]]
type = "peaking"   # Buckel bei 1,3 kHz, auch in deiner Messung sichtbar (+2,8 dB)
freq = 1288
q = 2.95
gain = -2.73

[[eq]]
type = "peaking"
freq = 1954
q = 2.03
gain = 1.88

# --- Hochton: leichte Senke 5–12 kHz im Direktschall (deine Messung und Erin) ---
[[eq]]
type = "peaking"
freq = 8000
q = 1.0
gain = 1.5
