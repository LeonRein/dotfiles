ref_knob_db = -19.0
low_hz = 35  # a little below the speakers' limit, for tolerance

# Mono-Bass: wirkt nur bei Aufnahmen, deren Bass links und rechts verschieden ist.
# Füllt dann die Senke der linken Box bei 62–82 Hz. 0 = aus.
mono_bass_hz = 110
#mono_bass_hz = 0   # aus

# --- Raummoden (nachgeschärft nach der Messung mit EQ vom 12.11.2026) ---
# Unter der Mono-Bass-Weiche (110 Hz) spielen beide Boxen dasselbe: dort gleiche Filter
# für beide, ausgelegt auf den Bass beider Boxen zusammen.
[[eq]]
type = "peaking"   # Längsmode 40 Hz
freq = 41.7
q = 10.0
gain = -12.3

[[eq]]
type = "peaking"   # Breitenmode 44 Hz
freq = 45.7
q = 10.0
gain = -5.5

[[eq]]
type = "peaking"   # Mode 60 Hz
freq = 59.5
q = 10.0
gain = -2.3

# Über der Weiche spielt jede Box ihr eigenes Signal: Filter je Box.
[[eq]]
type = "peaking"   # Modencluster 120 Hz
channel = "left"
freq = 121.1
q = 10.0
gain = -12.4

[[eq]]
type = "peaking"
channel = "left"
freq = 185.0
q = 10.0
gain = -1.6

[[eq]]
type = "peaking"   # Modencluster 120 Hz
channel = "right"
freq = 120.0
q = 10.0
gain = -15.8

# Ohne Mono-Bass (mono_bass_hz = 0) passen getrennte Bassfilter besser: dann die drei
# gemeinsamen Filter oben auskommentieren und diese hier aktivieren.
